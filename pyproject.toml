[project]
name = "ml-equity-xs"
version = "0.1.0"
description = "Machine-learning cross-sectional return models on a free US equity panel: code and paper"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "xgboost",
    "torch",
    "matplotlib",
    "pyyaml",
    "httpx",
    "yfinance",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
