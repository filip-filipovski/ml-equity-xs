# Three-zone data discipline for the equity cross-section.
#
# Equities have decades of history, so the TRAIN window is long and spans several
# regimes (GFC, ZIRP bull, COVID, 2022 rate shock). Discovery and tuning are confined to
# TRAIN; WFA_STAGE is a visible-but-never-tuned second gate; SEALED_TEST is the only honest
# out-of-sample buffer and must not be loaded during discovery (tripwire-enforced by
# eqxs.data_zones.safe_load_parquet).
#
# Bounds in force since 2026-10-11 (author decision):
#   TRAIN  2004-01-01 -> 2023-01-01  ~19y discovery (GFC, COVID, 2022 bear).
#   WFA    2023-01-01 -> 2024-07-01  18-month one-shot gate.
#   SEALED 2024-07-01 -> 2026-06-01  ~23 months sealed OOS, never read.
# Earlier studies (11-14) ran under the previous bounds (TRAIN to 2019-01-01, sealed from
# 2022-01-01) by passing an explicit earlier end date; the zone file can only tighten a bound.

zones:
  train:       {start: "2004-01-01", end: "2023-01-01"}   # ~19y discovery (incl. GFC, COVID, 2022)
  wfa_stage:   {start: "2023-01-01", end: "2024-07-01"}   # 18m one-shot gate
  sealed_test: {start: "2024-07-01", end: "2026-06-01"}   # ~23m sealed OOS

discipline:
  sealed_until: "fully_locked_config"
  wfa_until:    "train_only_gates_passed"
